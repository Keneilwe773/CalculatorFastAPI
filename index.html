<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        .calculator {
            margin-top: 50px;
            margin-left:350px;
            margin-right:350px;
            height: 470px;
            background-color: #f2f2f2;
            border-radius: 10px;

        }
        h1 {
            padding-top: 20px;
            padding-left: 20px;
        }

        .val1, .val2 {
            margin-left: 30px;
            margin-top: 30px;
        }

        input {
            height: 20px;
        }

        .addition, .subtraction, .multiplication, .division {
            width: 70px;
            height: 70px;
            font-size: 24px;
            margin: 10px;
            border-radius: 5px;
            border: solid 1px #ccc;
            cursor: pointer;
        }

        .buttons {
            margin-top: 30px;
            margin-left: 80px;
        }

        h2 {
            margin-top: 20px;
            margin-left: 30px;
        }

        .name {
            margin-top: 60px;
            text-align: center;
            font-weight: bold;
            font-style: italic;
            color: blue;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Calculator</h1>
        <form class="val1">
            <label for="quantity1">Enter first number:</label><br>
            <input type="number" id="quantity1" name="quantity1" required><br>
        </form>
        <form class="val2">
            <label for="quantity2">Enter second number:</label><br>
            <input type="number" id="quantity2" name="quantity2" required><br>
        </form>
        <div class="buttons">
            <button type="button" class="addition">+</button>
            <button type="button" class="subtraction">-</button>
            <button type="button" class="multiplication">x</button>
            <button type="button" class="division">/</button>
        </div>
        <h2 id="result">Answer: </h2>
        <p class="name">@ Keneilwe Boipelo Raseale</p>
    </div>
    <script>
    const num1Input = document.getElementById("quantity1");
    const num2Input = document.getElementById("quantity2");
    const result = document.getElementById("result");

    function calculate(operation){
        let num1 = num1Input.value;
        let num2 = num2Input.value;

        fetch(`/${operation}?num1=${num1}&num2=${num2}`)
        .then(response => response.json())
        .then(data => {
            if(data.answer !== undefined){
                result.innerHTML = "Answer: " + data.answer;
            }
            else{
                result.innerHTML = "Error: " + data.error;
            }
        });
    }

    document.querySelector(".addition")
    .addEventListener("click", function(){
        calculate("add");
    });

    document.querySelector(".subtraction")
    .addEventListener("click", function(){
        calculate("subtract");
    });

    document.querySelector(".multiplication")
    .addEventListener("click", function(){
        calculate("multiply");
    });

    document.querySelector(".division")
    .addEventListener("click", function(){
        calculate("divide");
    });
    </script>
</body>
</html>
